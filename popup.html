<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@600;800&family=DM+Mono:wght@400&display=swap');
  body {
    width: 220px;
    padding: 16px;
    background: #0d0d10;
    color: #e8e8f0;
    font-family: 'Syne', sans-serif;
    margin: 0;
  }
  h1 {
    font-size: 14px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin: 0 0 8px;
    background: linear-gradient(90deg, #7c6dfa, #fa6dc2);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  p {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: #5a5a72;
    margin: 0 0 14px;
    line-height: 1.5;
  }
  a {
    display: block;
    text-align: center;
    background: linear-gradient(135deg, #7c6dfa, #fa6dc2);
    color: #fff;
    text-decoration: none;
    font-size: 12px;
    font-weight: 700;
    padding: 8px;
    border-radius: 8px;
    letter-spacing: 0.04em;
  }
  a:hover { filter: brightness(1.1); }
</style>
</head>
<body>
  <h1>Flow Queue</h1>
  <p>Open Google Flow to see the prompt queue panel injected on the page.</p>
  <a href="https://labs.google/fx/tools/flow" target="_blank">Open Google Flow →</a>
</body>
</html>
